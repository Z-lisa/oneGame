<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水管连接小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            color: #00d4ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        #gameCanvas {
            border: 3px solid #00d4ff;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        #newGameBtn {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #1a1a2e;
        }
        #newGameBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }
        .status {
            margin-top: 15px;
            color: #fff;
            font-size: 18px;
            text-align: center;
        }
        .win-message {
            color: #00ff88;
            font-size: 24px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .info {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>水管连接小游戏</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="480" height="480"></canvas>
        <div class="controls">
            <button id="newGameBtn">新游戏</button>
        </div>
        <div class="status" id="status">点击水管旋转，连接起点到终点！</div>
        <div class="info">绿色 = 起点 | 红色 = 终点 | 蓝色 = 已连通</div>
    </div>

    <script>
        const GRID_SIZE = 8;
        const CELL_SIZE = 60;
        const DIRECTIONS = {
            UP: 0,
            RIGHT: 1,
            DOWN: 2,
            LEFT: 3
        };
        const DIR_OFFSET = {
            0: { dx: 0, dy: -1 },
            1: { dx: 1, dy: 0 },
            2: { dx: 0, dy: 1 },
            3: { dx: -1, dy: 0 }
        };
        const OPPOSITE = { 0: 2, 1: 3, 2: 0, 3: 1 };
        const PIPE_TYPES = {
            VERTICAL: { connections: [0, 2], name: '上下通' },
            HORIZONTAL: { connections: [1, 3], name: '左右通' },
            UP_RIGHT: { connections: [0, 1], name: '上右通' },
            RIGHT_DOWN: { connections: [1, 2], name: '右下通' },
            DOWN_LEFT: { connections: [2, 3], name: '下左通' },
            LEFT_UP: { connections: [3, 0], name: '左上通' }
        };
        const PIPE_LIST = Object.values(PIPE_TYPES);

        let grid = [];
        let startPos = null;
        let endPos = null;
        let pathCells = new Set();
        let isWin = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const newGameBtn = document.getElementById('newGameBtn');

        function initGrid() {
            grid = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    grid[y][x] = {
                        pipe: null,
                        rotation: 0,
                        isEmpty: true
                    };
                }
            }
        }

        function getEdgeCells() {
            const edges = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                edges.push({ x: i, y: 0, edge: 'top' });
                edges.push({ x: i, y: GRID_SIZE - 1, edge: 'bottom' });
                edges.push({ x: 0, y: i, edge: 'left' });
                edges.push({ x: GRID_SIZE - 1, y: i, edge: 'right' });
            }
            return edges;
        }

        function selectStartEnd() {
            const edges = getEdgeCells();
            const edgeGroups = {
                top: edges.filter(e => e.edge === 'top'),
                bottom: edges.filter(e => e.edge === 'bottom'),
                left: edges.filter(e => e.edge === 'left'),
                right: edges.filter(e => e.edge === 'right')
            };
            const edgeNames = ['top', 'bottom', 'left', 'right'];
            const startEdgeIdx = Math.floor(Math.random() * 4);
            let endEdgeIdx;
            do {
                endEdgeIdx = Math.floor(Math.random() * 4);
            } while (endEdgeIdx === startEdgeIdx);
            
            const startEdge = edgeNames[startEdgeIdx];
            const endEdge = edgeNames[endEdgeIdx];
            
            const startCells = edgeGroups[startEdge];
            const endCells = edgeGroups[endEdge];
            
            startPos = startCells[Math.floor(Math.random() * startCells.length)];
            endPos = endCells[Math.floor(Math.random() * endCells.length)];
            
            return { startPos, endPos };
        }

        function findPipeWithConnection(fromDir) {
            const neededDir = OPPOSITE[fromDir];
            const matching = PIPE_LIST.filter(pipe => pipe.connections.includes(neededDir));
            return matching.length > 0 ? matching[Math.floor(Math.random() * matching.length)] : null;
        }

        function findPipeWithTwoConnections(dir1, dir2) {
            const matching = PIPE_LIST.filter(pipe => 
                pipe.connections.includes(dir1) && pipe.connections.includes(dir2)
            );
            return matching.length > 0 ? matching[0] : null;
        }

        function generatePath() {
            initGrid();
            pathCells.clear();
            const { startPos: start, endPos: end } = selectStartEnd();
            
            const visited = new Set();
            const path = [];
            const queue = [{ x: start.x, y: start.y, path: [{ x: start.x, y: start.y }] }];
            visited.add(`${start.x},${start.y}`);
            
            while (queue.length > 0) {
                const currentIdx = Math.floor(Math.random() * queue.length);
                const current = queue.splice(currentIdx, 1)[0];
                
                if (current.x === end.x && current.y === end.y) {
                    path.push(...current.path);
                    break;
                }
                
                const neighbors = [];
                const dirs = [0, 1, 2, 3];
                
                for (const dir of dirs) {
                    const offset = DIR_OFFSET[dir];
                    const nx = current.x + offset.dx;
                    const ny = current.y + offset.dy;
                    
                    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && 
                        !visited.has(`${nx},${ny}`)) {
                        neighbors.push({ x: nx, y: ny, dir });
                    }
                }
                
                neighbors.sort(() => Math.random() - 0.5);
                
                for (const neighbor of neighbors) {
                    visited.add(`${neighbor.x},${neighbor.y}`);
                    queue.push({
                        x: neighbor.x,
                        y: neighbor.y,
                        path: [...current.path, { x: neighbor.x, y: neighbor.y }]
                    });
                }
            }
            
            if (path.length < 2) {
                return generatePath();
            }
            
            for (let i = 0; i < path.length; i++) {
                const cell = path[i];
                pathCells.add(`${cell.x},${cell.y}`);
                
                let pipe;
                if (i === 0) {
                    const next = path[1];
                    const toDir = getDirection(cell, next);
                    pipe = findPipeWithConnection(toDir);
                } else if (i === path.length - 1) {
                    const prev = path[i - 1];
                    const fromDir = getDirection(cell, prev);
                    pipe = findPipeWithConnection(fromDir);
                } else {
                    const prev = path[i - 1];
                    const next = path[i + 1];
                    const fromDir = getDirection(cell, prev);
                    const toDir = getDirection(cell, next);
                    pipe = findPipeWithTwoConnections(OPPOSITE[fromDir], toDir);
                    if (!pipe) {
                        pipe = findPipeWithTwoConnections(OPPOSITE[toDir], fromDir);
                    }
                }
                
                if (pipe) {
                    grid[cell.y][cell.x] = {
                        pipe: pipe,
                        rotation: 0,
                        isEmpty: false,
                        originalRotation: 0
                    };
                }
            }
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (grid[y][x].isEmpty) {
                        grid[y][x] = {
                            pipe: null,
                            rotation: 0,
                            isEmpty: true
                        };
                    }
                }
            }
        }

        function getDirection(from, to) {
            if (to.y < from.y) return DIRECTIONS.UP;
            if (to.y > from.y) return DIRECTIONS.DOWN;
            if (to.x > from.x) return DIRECTIONS.RIGHT;
            if (to.x < from.x) return DIRECTIONS.LEFT;
            return -1;
        }

        function getActualConnections(cell) {
            if (cell.isEmpty || !cell.pipe) return [];
            return cell.pipe.connections.map(dir => (dir + cell.rotation) % 4);
        }

        function hasConnection(cell, direction) {
            const connections = getActualConnections(cell);
            return connections.includes(direction);
        }

        function canConnect(x1, y1, x2, y2) {
            if (x1 < 0 || x1 >= GRID_SIZE || y1 < 0 || y1 >= GRID_SIZE) return false;
            if (x2 < 0 || x2 >= GRID_SIZE || y2 < 0 || y2 >= GRID_SIZE) return false;
            
            const cell1 = grid[y1][x1];
            const cell2 = grid[y2][x2];
            
            if (cell1.isEmpty || cell2.isEmpty) return false;
            
            let dir1to2, dir2to1;
            if (x2 > x1) { dir1to2 = DIRECTIONS.RIGHT; dir2to1 = DIRECTIONS.LEFT; }
            else if (x2 < x1) { dir1to2 = DIRECTIONS.LEFT; dir2to1 = DIRECTIONS.RIGHT; }
            else if (y2 > y1) { dir1to2 = DIRECTIONS.DOWN; dir2to1 = DIRECTIONS.UP; }
            else { dir1to2 = DIRECTIONS.UP; dir2to1 = DIRECTIONS.DOWN; }
            
            return hasConnection(cell1, dir1to2) && hasConnection(cell2, dir2to1);
        }

        function checkWin() {
            if (!startPos || !endPos) return false;
            
            const visited = new Set();
            const queue = [{ x: startPos.x, y: startPos.y }];
            visited.add(`${startPos.x},${startPos.y}`);
            
            while (queue.length > 0) {
                const current = queue.shift();
                
                if (current.x === endPos.x && current.y === endPos.y) {
                    return true;
                }
                
                for (let dir = 0; dir < 4; dir++) {
                    const offset = DIR_OFFSET[dir];
                    const nx = current.x + offset.dx;
                    const ny = current.y + offset.dy;
                    const key = `${nx},${ny}`;
                    
                    if (!visited.has(key) && canConnect(current.x, current.y, nx, ny)) {
                        visited.add(key);
                        queue.push({ x: nx, y: ny });
                    }
                }
            }
            
            return false;
        }

        function getConnectedCells() {
            if (!startPos) return new Set();
            
            const connected = new Set();
            const queue = [{ x: startPos.x, y: startPos.y }];
            connected.add(`${startPos.x},${startPos.y}`);
            
            while (queue.length > 0) {
                const current = queue.shift();
                
                for (let dir = 0; dir < 4; dir++) {
                    const offset = DIR_OFFSET[dir];
                    const nx = current.x + offset.dx;
                    const ny = current.y + offset.dy;
                    const key = `${nx},${ny}`;
                    
                    if (!connected.has(key) && canConnect(current.x, current.y, nx, ny)) {
                        connected.add(key);
                        queue.push({ x: nx, y: ny });
                    }
                }
            }
            
            return connected;
        }

        function scramblePipes() {
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = grid[y][x];
                    if (!cell.isEmpty && cell.pipe) {
                        const rotations = Math.floor(Math.random() * 4);
                        cell.rotation = rotations;
                    }
                }
            }
        }

        function drawPipe(x, y, cell, isConnected) {
            const centerX = x * CELL_SIZE + CELL_SIZE / 2;
            const centerY = y * CELL_SIZE + CELL_SIZE / 2;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(cell.rotation * Math.PI / 2);
            
            const pipeWidth = 16;
            const baseColor = isConnected ? '#00d4ff' : '#666';
            const strokeColor = isConnected ? '#00a8cc' : '#444';
            
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.fillStyle = baseColor;
            
            if (cell.pipe) {
                const conns = cell.pipe.connections;
                
                ctx.beginPath();
                
                if (conns.includes(0)) {
                    ctx.rect(-pipeWidth / 2, -CELL_SIZE / 2, pipeWidth, CELL_SIZE / 2);
                }
                if (conns.includes(1)) {
                    ctx.rect(0, -pipeWidth / 2, CELL_SIZE / 2, pipeWidth);
                }
                if (conns.includes(2)) {
                    ctx.rect(-pipeWidth / 2, 0, pipeWidth, CELL_SIZE / 2);
                }
                if (conns.includes(3)) {
                    ctx.rect(-CELL_SIZE / 2, -pipeWidth / 2, CELL_SIZE / 2, pipeWidth);
                }
                
                ctx.fill();
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(0, 0, pipeWidth / 2 + 2, 0, Math.PI * 2);
                ctx.fillStyle = isConnected ? '#00e5ff' : '#777';
                ctx.fill();
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
            
            const connectedCells = getConnectedCells();
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = grid[y][x];
                    const isConnected = connectedCells.has(`${x},${y}`);
                    
                    if (startPos && x === startPos.x && y === startPos.y) {
                        ctx.fillStyle = 'rgba(0, 255, 100, 0.2)';
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                    if (endPos && x === endPos.x && y === endPos.y) {
                        ctx.fillStyle = 'rgba(255, 100, 100, 0.2)';
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                    
                    if (!cell.isEmpty) {
                        drawPipe(x, y, cell, isConnected);
                    }
                }
            }
            
            if (startPos) {
                ctx.fillStyle = '#00ff66';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('起点', startPos.x * CELL_SIZE + CELL_SIZE / 2, startPos.y * CELL_SIZE + 12);
            }
            if (endPos) {
                ctx.fillStyle = '#ff6666';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('终点', endPos.x * CELL_SIZE + CELL_SIZE / 2, endPos.y * CELL_SIZE + 12);
            }
        }

        function handleClick(event) {
            if (isWin) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((event.clientX - rect.left) / CELL_SIZE);
            const y = Math.floor((event.clientY - rect.top) / CELL_SIZE);
            
            if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                const cell = grid[y][x];
                if (!cell.isEmpty && cell.pipe) {
                    cell.rotation = (cell.rotation + 1) % 4;
                    drawGrid();
                    
                    if (checkWin()) {
                        isWin = true;
                        statusEl.className = 'status win-message';
                        statusEl.textContent = '🎉 恭喜通关！点击"新游戏"开始下一关！';
                    }
                }
            }
        }

        function newGame() {
            isWin = false;
            statusEl.className = 'status';
            statusEl.textContent = '点击水管旋转，连接起点到终点！';
            
            generatePath();
            scramblePipes();
            drawGrid();
        }

        canvas.addEventListener('click', handleClick);
        newGameBtn.addEventListener('click', newGame);

        newGame();
    </script>
</body>
</html>
